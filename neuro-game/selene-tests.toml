std = "balatro"

[lints]
mixed_table = "allow"
incorrect_standard_library_use = "allow"
multiple_statements = "allow"
global_usage = "allow"

# test-harness specific:
unused_variable = "allow"   # mock callbacks intentionally ignore args
divide_by_zero = "allow"    # tests/test_json_wire.lua exercises inf/nan wire encoding on purpose
bad_string_escape = "allow" # tests/test_force_roundtrip.lua embeds raw byte-escape fixtures
